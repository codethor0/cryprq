name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Run nightly checks every day at 2 AM UTC
    - cron: '0 2 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. A job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  # Fast feedback job: fmt + clippy only (runs in parallel with full build)
  quick-check:
    name: Quick Check (fmt + clippy)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.88.0
        components: clippy, rustfmt
    
    - name: Cache cargo registry and target
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: Format check
      run: cargo fmt --all --check
    
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

  # Full build and test job
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.88.0
        components: clippy, rustfmt
    
    - name: Cache cargo registry and target
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: Build
      run: cargo build --release --workspace
    
    - name: Test
      run: cargo test --workspace
    
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    
    - name: Format check
      run: cargo fmt --all --check

  # Security checks job
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.88.0
    
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-
    
    - name: Install cargo-deny
      run: |
        set -euo pipefail
        CARGO_DENY_VERSION=0.18.6
        curl -fsSL \
          https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz \
          -o cargo-deny.tar.gz
        echo "a9c3db6db22288045ad8407bd0febbb13c6339b3d948d666ae8ef634fb3f3853  cargo-deny.tar.gz" | sha256sum --check --strict
        mkdir cargo-deny-extract
        tar -xzf cargo-deny.tar.gz -C cargo-deny-extract
        sudo install cargo-deny-extract/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny /usr/local/bin/cargo-deny
    
    - name: Install cargo-audit
      # The scanner needs CVSS 4 support; keep the application toolchain at Rust 1.88.
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/cargo-audit.tgz"
        curl -fsSL \
          https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz \
          -o "$archive"
        echo "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  $archive" | sha256sum --check --strict
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        sudo install "$RUNNER_TEMP/cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit" /usr/local/bin/cargo-audit
        cargo audit --version
    
    - name: Cache cargo-deny database
      uses: actions/cache@v4
      with:
        path: ~/.cargo/advisory-db
        key: ${{ runner.os }}-cargo-deny-db
        restore-keys: |
          ${{ runner.os }}-cargo-deny-db-
    
    - name: Cargo deny check
      run: cargo deny check
    
    - name: Cargo audit
      if: ${{ !cancelled() }}
      # Keep the existing cargo-deny exception for the unmaintained rustls-pemfile crate.
      run: cargo audit

  # Governance checks job
  governance:
    name: Governance Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Test CI failure gates
      run: python3 -m unittest discover -s scripts/tests -v
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    
    - name: Install Node.js dependencies
      run: |
        cd web
        npm ci
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.88.0
        components: clippy, rustfmt
    
    - name: Cache cargo registry and target
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: Run Governance Shield
      run: python3 scripts/governance_shield.py

  # Nightly/scheduled job for heavier checks
  nightly:
    name: Nightly Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.88.0
        components: clippy, rustfmt
    
    - name: Cache cargo registry and target
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: Build documentation
      run: cargo doc --workspace --no-deps --document-private-items
    
    - name: Check documentation for blocking errors
      run: |
        set -euo pipefail
        cargo doc --workspace --no-deps
    
    - name: Build with all features
      run: cargo build --release --workspace --all-features
    
    - name: Test with all features
      run: cargo test --workspace --all-features

  # Two independent portals and the authenticated CLI, with verified downloads.
  web-e2e-smoke:
    name: Authenticated Portal E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: cryprq-portal-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            web/package-lock.json

      - name: Build and start isolated portals
        run: |
          set -euo pipefail
          docker compose -f docker-compose.portal.yml up --build -d --wait --wait-timeout 90

      - name: Test adapter with the real CLI
        run: docker compose -f docker-compose.portal.yml exec -T portal-a sh -c 'node --test web/server/*.test.mjs'

      - name: Install web dependencies
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Check web build, lint, and dependencies
        working-directory: web
        run: |
          set -euo pipefail
          npm run build
          npm run lint
          npm audit
          npm --prefix server audit --package-lock-only

      - name: Transfer files in two browsers
        working-directory: web
        env:
          CRYPRQ_WEB_BASE_URL: "http://127.0.0.1:18787"
          CRYPRQ_WEB_PEER_URL: "http://127.0.0.1:18788"
        run: |
          set -euo pipefail
          npx playwright test

      - name: Collect portal logs
        if: ${{ always() }}
        run: docker compose -f docker-compose.portal.yml logs --no-color > portal-compose.log

      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: portal-e2e-evidence-${{ github.run_id }}
          path: |
            web/playwright-report
            web/test-results
            portal-compose.log
          if-no-files-found: ignore

      - name: Tear down isolated portals
        if: ${{ always() }}
        run: |
          docker compose -f docker-compose.portal.yml down --volumes
