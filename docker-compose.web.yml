# One portal device. For two devices on one machine use
# docker-compose.portal.yml, which needs no published UDP port.
#
# The web port and the transfer port are published on host loopback only.
# Set CRYPRQ_ADVERTISE_ADDR to the address other devices reach this one at.

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile.web
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${CRYPRQ_PORTAL_PORT:-8787}:${CRYPRQ_PORTAL_PORT:-8787}"
      - "127.0.0.1:${CRYPRQ_PORTAL_UDP_PORT:-9999}:9999/udp"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      CRYPRQ_CONTAINER: "1"
      PORT: "${CRYPRQ_PORTAL_PORT:-8787}"
      CRYPRQ_LISTEN_ADDR: /ip4/0.0.0.0/udp/9999
      CRYPRQ_ADVERTISE_ADDR: "${CRYPRQ_ADVERTISE_ADDR:-/ip4/127.0.0.1/udp/9999}"
      CRYPRQ_STATE_DIR: /data
    volumes:
      - portal-state:/data
    command: ["node", "web/server/server.mjs"]

volumes:
  portal-state:
