[package]
name = "p2p"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
# Only the libp2p components that are used. The umbrella `libp2p` crate is not
# a dependency: it would put its optional mDNS and DNS packages, and with them
# hickory-proto, into Cargo.lock even though they are never built.
libp2p-core = "0.43"
libp2p-identity = { version = "0.2", features = ["ed25519", "peerid", "rand"] }
libp2p-swarm = { version = "0.47", features = ["tokio", "macros"] }
libp2p-quic = { version = "0.13", features = ["tokio"] }
libp2p-tcp = { version = "0.44", features = ["tokio"] }
libp2p-noise = "0.46"
libp2p-yamux = "0.47"
libp2p-ping = "0.47"
libp2p-request-response = "0.29"
libp2p-connection-limits = "0.6"
cryprq-crypto = { path = "../crypto" }
zeroize = "1.8"
rand = "0.8"
once_cell = "1.21"
log = "0.4"
void = "1"
thiserror = "1.0"
prometheus = "0.14"
hyper = { version = "1.7", features = ["full"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
async-trait = "0.1"
futures = "0.3"
node = { path = "../node" }
sha2 = "0.10"
